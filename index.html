<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Leave Tracker</title>
<style>
:root{--bg:#0d1020;--card:#171b33;--card2:#1e2342;--tx:#f1f3ff;--mut:#8f97c2;--ln:#2a3059;--ok:#46d39a;--bad:#ff6b7a;--warn:#ffb648;--pri:#7c8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0px) 0 calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(135deg,#5b46f0,#2aa6c8);border-radius:0 0 28px 28px;padding:22px 20px 20px;margin:0 -16px 14px;box-shadow:0 10px 30px rgba(60,70,230,.35)}
.hero small{opacity:.8;font-size:13px}
.hero h1{margin:2px 0 0;font-size:26px;letter-spacing:-.3px}
.chips{display:flex;gap:8px;margin-top:14px}
.chip{flex:1;background:rgba(255,255,255,.17);backdrop-filter:blur(6px);border-radius:14px;padding:9px 10px}
.chip b{display:block;font-size:20px}.chip span{font-size:11px;opacity:.85}
.week{display:flex;gap:6px;margin-bottom:14px}
.wd{flex:1;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px 0;color:var(--mut);text-align:center;font-size:11px;position:relative}
.wd b{display:block;font-size:17px;color:var(--tx);margin-top:2px}
.wd.on{background:var(--pri);border-color:var(--pri);color:#fff}.wd.on b{color:#fff}
.wd.tdy:not(.on){border-color:var(--pri)}
.wd i{position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--bad)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav h2{margin:0;font-size:16px}
.nb{background:var(--card);border:1px solid var(--ln);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:18px}
.cl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;border-left:5px solid var(--c);transition:.15s}
.cl.A{background:#2a1b2b}.cl.C{opacity:.55}
.cl .i{flex:1;min-width:0}.cl .i b{font-size:17px}.cl .i div{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.sg button{border:0;background:none;color:var(--mut);width:42px;height:38px;border-radius:10px;font-size:16px;font-weight:700}
.cl.P .sg [data-v=P]{background:var(--ok);color:#06281b}
.cl.A .sg [data-v=A]{background:var(--bad);color:#3a0710}
.cl.C .sg [data-v=C]{background:#6b739e;color:#fff}
.empty{text-align:center;color:var(--mut);padding:34px 14px;background:var(--card);border:1px dashed var(--ln);border-radius:18px;line-height:1.6}
.empty big{font-size:34px;display:block}
.btns{display:flex;gap:8px;margin:14px 0}
.btn{flex:1;background:var(--card);border:1px solid var(--ln);color:var(--tx);border-radius:14px;padding:13px;font-size:14px;font-weight:600}
.btn.bad{color:var(--bad)}
.legend{text-align:center;font-size:11px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--card);border-radius:20px;padding:14px;text-align:center;position:relative;overflow:hidden}
.sc:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.ring{position:relative;width:84px;height:84px;margin:6px auto 8px}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.ring div small{font-size:10px;color:var(--mut);font-weight:500}
.sc b{font-size:16px}.sc .n{font-size:11px;color:var(--mut);margin:2px 0 6px;min-height:28px}
.sc .st{font-size:12px;font-weight:700;border-radius:999px;padding:4px 8px;display:inline-block}
.sc .ds{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.4}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(23,27,51,.94);backdrop-filter:blur(12px);border-top:1px solid var(--ln);display:flex;padding:8px 20px calc(8px + env(safe-area-inset-bottom,0px));gap:10px}
.tabbar button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:14px;font-size:12px;font-weight:600}
.tabbar button span{display:block;font-size:20px}
.tabbar button.on{color:#fff;background:var(--pri)}
</style>
</head>
<body>
<div class="wrap">
 <div class="hero"><small id="hs">Integrated Program in Management · Sem VI</small><h1 id="hh">Leave Tracker</h1>
  <div class="chips"><div class="chip"><b id="c1">0</b><span>Leaves used</span></div><div class="chip"><b id="c2">9</b><span>Max per subject</span></div><div class="chip"><b id="c3">–</b><span>Most at risk</span></div></div></div>
 <div id="v1">
  <div class="week" id="wk"></div>
  <div class="nav"><button class="nb" id="pv">‹</button><h2 id="dl"></h2><button class="nb" id="nx">›</button></div>
  <div id="list"></div>
  <div class="btns" id="bt"><button class="btn bad" id="aa">Whole day absent</button><button class="btn" id="ap">Reset day</button></div>
  <div class="legend">✓ Present &nbsp;·&nbsp; ✕ Absent &nbsp;·&nbsp; ⊘ Cancelled (not counted)</div>
 </div>
 <div id="v2" hidden><div class="grid" id="gr"></div><div class="btns"><button class="btn bad" id="rs">Erase all data</button></div></div>
</div>
<div class="tabbar"><button id="t1" class="on"><span>📅</span>Days</button><button id="t2"><span>📊</span>Subjects</button></div>
<script>
var MAX=9;
var S={BL:["Business Laws","#ffb15e"],PP:["Public Policy","#6aa8ff"],TLD:["Talent & Leadership Dev.","#b48cff"],BEM:["Behavioral Economics","#5bd69a"],FTSA:["Financial Time Series","#ffe066"],FPM:["Project Management","#ff8fb1"],IGT:["Intro to Game Theory","#4fd6e8"],ODM:["Optimization for Decisions","#d2b48c"]};
var TT={1:[["10:30 am","FPM"],["1:45 pm","BL"],["4:15 pm","BEM"],["5:30 pm","IGT"]],
2:[["8:00 am","PP"],["9:15 am","TLD"],["11:45 am","FPM"],["3:00 pm","FTSA"],["4:15 pm","ODM"],["5:30 pm","BL"]],
3:[["8:00 am","BEM"],["10:30 am","FTSA"],["1:45 pm","PP"],["3:00 pm","TLD"],["4:15 pm","IGT"],["5:30 pm","ODM"]],
4:[["9:15 am","IGT"],["10:30 am","BL"],["11:45 am","FPM"],["3:00 pm","ODM"]],
5:[["8:00 am","FTSA"],["1:45 pm","BEM"],["3:00 pm","PP"],["4:15 pm","TLD"]]};
var DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var SEM0="2026-11-02",SEM1="2027-03-07",EX0="2026-12-28",EX1="2027-01-04",KEY="leaveTrackerV1",data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function $(i){return document.getElementById(i)}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function now(){var d=new Date();d.setHours(12,0,0,0);return d}
var cur=now();
function cls(d){var k=ds(d);if(k<SEM0||k>SEM1||(k>=EX0&&k<=EX1))return[];return TT[d.getDay()]||[]}
function msg(d){var k=ds(d),w=d.getDay();if(k<SEM0)return["🌴","Semester hasn’t started yet"];if(k>SEM1)return["🎓","Semester is over"];if(k>=EX0&&k<=EX1)return["📝","Mid-semester exam break"];return["🎉","No regular classes today"+(w%6===0?"<br>(Visiting faculty sessions only)":"")]}
function day(){
  var k=ds(cur),c=cls(cur),t=ds(now()),h="";
  $("dl").textContent=DN[cur.getDay()]+", "+cur.getDate()+" "+MN[cur.getMonth()];
  var m=new Date(cur);m.setDate(m.getDate()-((m.getDay()+6)%7));var w="";
  for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);var dk=ds(d),dot=Object.keys(data).some(function(x){return x.indexOf(dk)===0&&data[x]==="A"});
    w+='<button class="wd'+(dk===k?" on":"")+(dk===t?" tdy":"")+'" data-d="'+dk+'">'+"MTWTFSS"[i]+"<b>"+d.getDate()+"</b>"+(dot?"<i></i>":"")+"</button>"}
  $("wk").innerHTML=w;
  if(!c.length){var e=msg(cur);h='<div class="empty"><big>'+e[0]+'</big>'+e[1]+'</div>'}
  c.forEach(function(x){var s=data[k+"|"+x[1]]||"P";
    h+='<div class="cl '+s+'" style="--c:'+S[x[1]][1]+'" data-s="'+x[1]+'"><div class="i"><b>'+x[1]+'</b><div>'+x[0]+' · '+S[x[1]][0]+'</div></div><div class="sg"><button data-v="P">✓</button><button data-v="A">✕</button><button data-v="C">⊘</button></div></div>'});
  $("list").innerHTML=h;$("bt").style.display=c.length?"":"none";
  var hr=new Date().getHours();$("hh").textContent=(hr<12?"Good morning":hr<17?"Good afternoon":"Good evening")+" 👋";
  head();
}
function counts(){var o={};for(var s in S)o[s]={a:0,c:0,d:[]};
  for(var key in data){var p=key.split("|");if(!o[p[1]])continue;if(data[key]==="A"){o[p[1]].a++;var q=p[0].split("-");o[p[1]].d.push(p[0])}else o[p[1]].c++}
  return o}
function head(){var o=counts(),t=0,mx=-1,ms="–";for(var s in o){t+=o[s].a;if(o[s].a>mx&&o[s].a>0){mx=o[s].a;ms=s}}$("c1").textContent=t;$("c3").textContent=ms}
function subs(){var o=counts(),h="",R=2*Math.PI*36;
  for(var s in S){var a=o[s].a,l=MAX-a,col=a>=MAX?"var(--bad)":a>=7?"var(--warn)":"var(--ok)";
    var tx=l>0?l+" left":l===0?"No leaves left":Math.abs(l)+" over!";
    var dd=o[s].d.sort().map(function(x){var q=x.split("-");return+q[2]+" "+MN[+q[1]-1]}).join(", ");
    h+='<div class="sc" style="--c:'+S[s][1]+'"><div class="ring"><svg width="84" height="84"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--card2)" stroke-width="8"/><circle cx="42" cy="42" r="36" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+R+'" stroke-dashoffset="'+R*(1-Math.min(1,a/MAX))+'"/></svg><div>'+a+'<small>of '+MAX+'</small></div></div><b>'+s+'</b><div class="n">'+S[s][0]+'</div><span class="st" style="color:'+col+';background:var(--card2)">'+tx+'</span>'+(dd?'<div class="ds">'+dd+'</div>':'')+'</div>'}
  $("gr").innerHTML=h;head()}
$("list").onclick=function(e){var b=e.target.closest("[data-v]");if(!b)return;var s=b.closest(".cl").dataset.s,key=ds(cur)+"|"+s;if(b.dataset.v==="P")delete data[key];else data[key]=b.dataset.v;save();day();if(navigator.vibrate)navigator.vibrate(12)};
$("wk").onclick=function(e){var b=e.target.closest("[data-d]");if(!b)return;var q=b.dataset.d.split("-");cur=new Date(+q[0],+q[1]-1,+q[2],12);day()};
function setAll(v){cls(cur).forEach(function(x){var k=ds(cur)+"|"+x[1];if(v)data[k]=v;else delete data[k]});save();day()}
$("aa").onclick=function(){setAll("A")};$("ap").onclick=function(){setAll(null)};
$("pv").onclick=function(){cur.setDate(cur.getDate()-1);day()};$("nx").onclick=function(){cur.setDate(cur.getDate()+1);day()};
function tab(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":"";n===2?subs():day()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
$("rs").onclick=function(){if(confirm("Erase every leave you’ve recorded?")){data={};save();subs()}};
day();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
